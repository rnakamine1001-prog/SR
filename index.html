<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Study Review</title>

  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="./manifest.json" />

  <style>
    :root { --bg:#0b0b0c; --card:#151518; --text:#f3f4f6; --muted:#a1a1aa; --line:#27272a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
           background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; background:rgba(11,11,12,.9); backdrop-filter: blur(10px);
             border-bottom:1px solid var(--line); padding:14px 14px 10px; }
    h1 { margin:0; font-size:18px; }
    .sub { margin-top:6px; font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
    main { padding:14px; max-width:860px; margin:0 auto; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; }
    .grow { flex:1; }
    input, textarea, button, select {
      width:100%; border-radius:12px; border:1px solid var(--line);
      background:#0f0f12; color:var(--text); padding:12px; font-size:16px;
    }
    textarea { min-height:92px; resize:vertical; }
    button { cursor:pointer; font-weight:650; }
    button.primary { background:#ffffff; color:#111; border-color:#fff; }
    button.danger { background:#ef4444; border-color:#ef4444; color:#111; }
    button.ghost { background:transparent; }
    .list { display:flex; flex-direction:column; gap:10px; }
    .item { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .title { font-size:16px; font-weight:700; }
    .meta { font-size:12px; color:var(--muted); margin-top:6px; }
    .pill { font-size:12px; color:#111; background:#e5e7eb; padding:4px 8px; border-radius:999px; }
    .tabs { display:flex; gap:10px; }
    .tab { flex:1; }
    .hide { display:none; }
    .small { font-size:12px; color:var(--muted); line-height:1.5; }
    .hr { height:1px; background:var(--line); margin:10px 0; }
    .right { text-align:right; }
  </style>
</head>
<body>
<header>
  <h1>Study Review</h1>
  <div class="sub" id="statusLine"></div>
</header>

<main>
  <div class="tabs row">
    <button class="tab ghost" id="tabToday">今日の復習</button>
    <button class="tab ghost" id="tabAll">一覧</button>
    <button class="tab ghost" id="tabSettings">設定</button>
  </div>

  <section id="viewToday" class="card" style="margin-top:12px;">
    <div class="row">
      <div class="grow">
        <div class="title">今日やる</div>
        <div class="small">nextReview が「今日」より前の章だけ出ます。完了は1タップ。</div>
      </div>
      <div class="right">
        <div class="pill" id="dueCount">0件</div>
      </div>
    </div>
    <div class="hr"></div>
    <div class="list" id="dueList"></div>
    <div class="small" id="dueEmpty" style="margin-top:10px;">今日は未消化なし。追加するか、一覧を見てください。</div>
  </section>

  <section id="viewAll" class="card hide" style="margin-top:12px;">
    <div class="row">
      <div class="grow">
        <div class="title">章を追加</div>
        <div class="small">初学登録すると「当日23:59」が最初の復習になります（interval=0扱い）。</div>
      </div>
    </div>
    <div class="hr"></div>
    <div class="row">
      <input id="newTitle" placeholder="例：行政法 取消し / 民法 代理 など（音声入力OK）" />
      <button class="primary" id="addBtn">追加</button>
    </div>

    <div class="hr"></div>

    <div class="row" style="align-items:center;">
      <div class="grow">
        <div class="title">全一覧</div>
        <div class="small">検索はブラウザの検索でもOK。将来ここに検索欄を足せます。</div>
      </div>
      <div class="right">
        <div class="pill" id="allCount">0件</div>
      </div>
    </div>

    <div class="hr"></div>
    <div class="list" id="allList"></div>
  </section>

  <section id="viewSettings" class="card hide" style="margin-top:12px;">
    <div class="title">復習間隔（日）</div>
    <div class="small">
      1行に1つ数字を書きます。<br/>
      <b>0 は「当日23:59」</b>（初学当日の復習）です。<br/>
      例：0 / 1 / 1 / 1 / 1 / 2 / 7 / 14 / 14 …
    </div>
    <div class="hr"></div>

    <textarea id="intervalsBox"></textarea>
    <div class="row" style="margin-top:10px;">
      <button class="primary" id="saveIntervalsBtn">保存</button>
      <button class="ghost" id="resetIntervalsBtn">初期値に戻す</button>
    </div>

    <div class="hr"></div>

    <div class="title">バックアップ</div>
    <div class="small">端末移行・復元用。JSONをコピー/貼り付け。</div>
    <div class="hr"></div>
    <div class="row">
      <button class="ghost" id="exportBtn">エクスポート（JSON表示）</button>
      <button class="ghost" id="importBtn">インポート（JSON貼り付け）</button>
      <button class="danger" id="wipeBtn">全削除</button>
    </div>

    <pre id="exportOut" class="card hide" style="white-space:pre-wrap; margin-top:12px;"></pre>
  </section>
</main>

<script>
(() => {
  const KEY = "study_review_v1";

  const DEFAULT_INTERVALS = [0, 1, 1, 1, 1, 2, 3, 7, 14, 14, 14, 14, 30, 30, 60];

  /** utils */
  const pad2 = n => String(n).padStart(2, "0");
  const toISO = d => d.toISOString();
  const fromISO = s => new Date(s);
  const endOfDay = (d) => {
    const x = new Date(d);
    x.setHours(23, 59, 0, 0);
    return x;
  };
  const addDays = (d, days) => {
    const x = new Date(d);
    x.setDate(x.getDate() + days);
    return x;
  };
  const fmt = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { intervals: DEFAULT_INTERVALS.slice(), items: [] };
      const st = JSON.parse(raw);
      if (!Array.isArray(st.intervals) || !Array.isArray(st.items)) throw new Error("bad schema");
      return st;
    } catch {
      return { intervals: DEFAULT_INTERVALS.slice(), items: [] };
    }
  }
  function saveState(st) {
    localStorage.setItem(KEY, JSON.stringify(st));
  }

  function normalizeIntervals(text) {
    const vals = text
      .split(/\r?\n/)
      .map(s => s.trim())
      .filter(Boolean)
      .map(s => Number(s));
    const ok = vals.filter(v => Number.isFinite(v) && v >= 0);
    return ok.length ? ok : DEFAULT_INTERVALS.slice();
  }

  function getNextReview(now, step, intervals) {
    // step は「次に使うintervalのindex」
    const idx = Math.min(step, intervals.length - 1);
    const interval = intervals[idx] ?? intervals[intervals.length - 1] ?? 1;
    if (interval === 0) return endOfDay(now);            // 当日中
    return endOfDay(addDays(now, interval));             // 以降は日数＋23:59固定
  }

  /** DOM */
  const el = (id) => document.getElementById(id);

  const statusLine = el("statusLine");
  const dueList = el("dueList");
  const dueEmpty = el("dueEmpty");
  const dueCount = el("dueCount");

  const allList = el("allList");
  const allCount = el("allCount");

  const newTitle = el("newTitle");
  const addBtn = el("addBtn");

  const intervalsBox = el("intervalsBox");
  const saveIntervalsBtn = el("saveIntervalsBtn");
  const resetIntervalsBtn = el("resetIntervalsBtn");

  const exportBtn = el("exportBtn");
  const importBtn = el("importBtn");
  const wipeBtn = el("wipeBtn");
  const exportOut = el("exportOut");

  const tabToday = el("tabToday");
  const tabAll = el("tabAll");
  const tabSettings = el("tabSettings");

  const viewToday = el("viewToday");
  const viewAll = el("viewAll");
  const viewSettings = el("viewSettings");

  function switchTab(name) {
    viewToday.classList.toggle("hide", name !== "today");
    viewAll.classList.toggle("hide", name !== "all");
    viewSettings.classList.toggle("hide", name !== "settings");
  }

  /** render */
  function render() {
    const st = loadState();
    const now = new Date();

    // status
    const todayEnd = endOfDay(now);
    statusLine.textContent = `現在：${fmt(now)} / 今日の締め：${fmt(todayEnd)}`;

    // ensure intervals box
    intervalsBox.value = st.intervals.join("\n");

    // due items
    const due = st.items
      .map(it => ({...it, next: fromISO(it.nextReviewAt)}))
      .filter(it => it.next <= todayEnd)
      .sort((a,b) => a.next - b.next);

    dueCount.textContent = `${due.length}件`;

    dueList.innerHTML = "";
    dueEmpty.style.display = due.length ? "none" : "block";

    for (const it of due) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="item">
          <div>
            <div class="title">${escapeHtml(it.title)}</div>
            <div class="meta">
              step:${it.step} / 次回：${fmt(fromISO(it.nextReviewAt))}<br/>
              最終：${it.lastReviewedAt ? fmt(fromISO(it.lastReviewedAt)) : "—"}
            </div>
          </div>
          <div style="min-width:140px; display:flex; flex-direction:column; gap:8px;">
            <button class="primary" data-act="done" data-id="${it.id}">完了</button>
            <button class="ghost" data-act="snooze" data-id="${it.id}">今日中に戻す</button>
          </div>
        </div>
      `;
      dueList.appendChild(card);
    }

    // all list
    allCount.textContent = `${st.items.length}件`;
    const allSorted = st.items
      .map(it => ({...it, next: fromISO(it.nextReviewAt)}))
      .sort((a,b) => a.next - b.next);

    allList.innerHTML = "";
    for (const it of allSorted) {
      const card = document.createElement("div");
      card.className = "card";
      const isDue = fromISO(it.nextReviewAt) <= now;
      card.innerHTML = `
        <div class="item">
          <div>
            <div class="title">${escapeHtml(it.title)} ${isDue ? `<span class="pill">要復習</span>` : ""}</div>
            <div class="meta">
              step:${it.step} / 次回：${fmt(fromISO(it.nextReviewAt))}<br/>
              最終：${it.lastReviewedAt ? fmt(fromISO(it.lastReviewedAt)) : "—"}
            </div>
          </div>
          <div style="min-width:160px; display:flex; flex-direction:column; gap:8px;">
            <button class="primary" data-act="done" data-id="${it.id}">完了</button>
            <button class="danger" data-act="del" data-id="${it.id}">削除</button>
          </div>
        </div>
      `;
      allList.appendChild(card);
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  /** actions */
  addBtn.addEventListener("click", () => {
    const title = newTitle.value.trim();
    if (!title) return;

    const st = loadState();
    const now = new Date();

    const item = {
      id: uid(),
      title,
      step: 0,                           // 初学直後の復習（intervals[0] = 0 を想定）
      createdAt: toISO(now),
      lastReviewedAt: null,
      nextReviewAt: toISO(getNextReview(now, 0, st.intervals)) // 当日23:59
    };

    st.items.push(item);
    saveState(st);
    newTitle.value = "";
    render();
    switchTab("today");
  });

  // delegate buttons
  document.body.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const act = btn.dataset.act;
    const id = btn.dataset.id;
    if (!act || !id) return;

    const st = loadState();
    const idx = st.items.findIndex(x => x.id === id);
    if (idx < 0) return;

    const now = new Date();

    if (act === "done") {
      st.items[idx].lastReviewedAt = toISO(now);
      st.items[idx].step = (st.items[idx].step ?? 0) + 1;
      st.items[idx].nextReviewAt = toISO(getNextReview(now, st.items[idx].step, st.intervals));
      saveState(st);
      render();
      return;
    }

    if (act === "snooze") {
      // いつでも「当日23:59」に戻せる（事故防止）
      st.items[idx].nextReviewAt = toISO(endOfDay(now));
      saveState(st);
      render();
      return;
    }

    if (act === "del") {
      st.items.splice(idx, 1);
      saveState(st);
      render();
      return;
    }
  });

  saveIntervalsBtn.addEventListener("click", () => {
    const st = loadState();
    const next = normalizeIntervals(intervalsBox.value);
    st.intervals = next;
    saveState(st);
    exportOut.classList.add("hide");
    render();
    alert("保存しました。次回の計算から反映されます。");
  });

  resetIntervalsBtn.addEventListener("click", () => {
    intervalsBox.value = DEFAULT_INTERVALS.join("\n");
  });

  exportBtn.addEventListener("click", () => {
    const st = loadState();
    exportOut.textContent = JSON.stringify(st, null, 2);
    exportOut.classList.remove("hide");
    switchTab("settings");
  });

  importBtn.addEventListener("click", () => {
    const txt = prompt("JSONを貼り付けてください（全置換します）");
    if (!txt) return;
    try {
      const obj = JSON.parse(txt);
      if (!Array.isArray(obj.intervals) || !Array.isArray(obj.items)) throw new Error("schema");
      saveState(obj);
      exportOut.classList.add("hide");
      render();
      alert("インポートしました。");
    } catch {
      alert("JSONが不正です。");
    }
  });

  wipeBtn.addEventListener("click", () => {
    if (!confirm("全データを削除します。よろしいですか？")) return;
    localStorage.removeItem(KEY);
    exportOut.classList.add("hide");
    render();
  });

  tabToday.addEventListener("click", () => switchTab("today"));
  tabAll.addEventListener("click", () => switchTab("all"));
  tabSettings.addEventListener("click", () => switchTab("settings"));

  // register service worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    });
  }

  render();
  switchTab("today");
})();
</script>
</body>
</html>
